# =============================================================================
# BRASILIA-NIGHT — /etc/wsl.conf (Arch Linux WSL 2)
# Para aplicar (com backup e sudo):
#   sudo cp /etc/wsl.conf /etc/wsl.conf.bak.$(date +%Y%m%d)
#   sudo cp ~/brasilia-night/wsl-system/wsl.conf /etc/wsl.conf
#   Em seguida, no PowerShell: wsl --terminate archlinux
# =============================================================================

[boot]
systemd = true

[user]
default = JVZerinho

[network]
hostname = gama
generateHosts = true
generateResolvConf = true

[interop]
enabled = true
appendWindowsPath = true

[automount]
enabled = true
mountFsTab = false
root = /mnt/
options = "metadata,umask=22,fmask=11"
