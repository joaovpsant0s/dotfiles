# =============================================================================
# NOCTURNE — /etc/wsl.conf (Arch Linux WSL 2)
# =============================================================================

[boot]
systemd = true

[user]
default = JVZerinho

[network]
hostname = arch
generateHosts = true
generateResolvConf = true

[interop]
enabled = true
appendWindowsPath = true

[automount]
enabled = true
mountFsTab = false
root = /mnt/
options = "metadata,umask=22,fmask=11"
