<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 12px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bn-bg-alt);
      color: var(--bn-fg);
      border-bottom: 1px solid var(--bn-border);
      font: 12px "GeistMono Nerd Font Mono", "Cascadia Mono", monospace;
    }
    .section { display: flex; align-items: center; gap: 9px; }
    .brand { color: var(--bn-accent); font-weight: 700; letter-spacing: .12em; }
    .tag { color: var(--bn-fg-muted); }
    .clock {
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bn-selection);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="section">
    <span class="brand">▲ NOCTURNE</span>
    <span class="tag">/ WINDOWS HOST</span>
  </div>
  <div class="section">
    <span id="date" class="tag"></span>
    <time id="clock" class="clock"></time>
  </div>
  <script>
    const day = new Intl.DateTimeFormat("pt-BR", { weekday: "short", day: "2-digit", month: "short" });
    const time = new Intl.DateTimeFormat("pt-BR", { hour: "2-digit", minute: "2-digit" });
    function updateClock() {
      const now = new Date();
      document.querySelector("#date").textContent = day.format(now);
      document.querySelector("#clock").textContent = time.format(now);
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
