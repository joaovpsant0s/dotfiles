# =============================================================================
# BRASILIA-NIGHT — TMUX CONFIGURATION
# Arquitetura Modernista · Prefix Ctrl+a · OSC52 · Smart Splits · Resurrect
# =============================================================================

# --- Prefix Ctrl+a ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Core Options ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:Tc,xterm*:extkeys"
set -s escape-time 0
set -g history-limit 50000
set -g display-time 2500
set -g status-interval 5
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
setw -g mode-keys vi
setw -g aggressive-resize on

# --- Numbering starts at 1 ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Reload Configuration ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "🏛 brasilia-night: tmux.conf recarregado"

# --- Splits & Windows in current directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Smart-Splits Navigation (Tmux <-> Neovim) ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# --- Resize Panes ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy Mode (Vi + OSC52) ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Sesh Picker & Workbench Keybindings ---
bind f display-popup -E -w 75% -h 65% "$HOME/.local/bin/sesh-picker"
bind s display-popup -E -w 75% -h 65% "$HOME/.local/bin/sesh-picker"
bind w run-shell "$HOME/.local/bin/wb code '#{pane_current_path}'"
bind A run-shell "$HOME/.local/bin/wb algo '#{pane_current_path}'"

# --- Source Generated Theme (with fallback to repo path) ---
if-shell "[ -f ~/.config/tmux/theme-generated.conf ]" \
  "source-file ~/.config/tmux/theme-generated.conf" \
  "if-shell '[ -f ~/brasilia-night/tmux/.config/tmux/theme-generated.conf ]' 'source-file ~/brasilia-night/tmux/.config/tmux/theme-generated.conf'"

# --- TPM Plugins (Resilient if TPM is not yet installed) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

if-shell "[ -x ~/.config/tmux/plugins/tpm/tpm ]" \
  "run '~/.config/tmux/plugins/tpm/tpm'"
