name: CI — Theme Engine, Stow & Integration Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Validate & Test Suite
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Arch test dependencies
        run: pacman -Syu --noconfirm --needed git python stow shellcheck fastfetch

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run full test suite
        run: make test
