name: CI — Theme Engine, Stow & Integration Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Validate & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12+
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GNU Stow
        run: sudo apt-get update && sudo apt-get install -y stow gcc

      - name: Run full test suite
        run: make test
